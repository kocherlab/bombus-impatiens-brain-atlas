# Bento subcellular analysis — all brain x region pairs
# Usage: snakemake --profile ../../config/profiles/slurm
#
# repo_root is optional here — the Snakefile derives it from its own location
# by default. Set it only to override (e.g. running against a different clone).

# Interpreter with bento-tools installed (repo-relative or absolute). Not the
# shared .venv, which lacks bento-tools; no such env is built on this cluster,
# so jobs stop with a message until one is.
bento_python: ".venv-bento/bin/python"

